name: ortaq
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  web: ^1.1.1
  file_picker: ^10.1.0
  shared_preferences: ^2.5.3
flutter:
  uses-material-design: true
  fonts:
    - family: OrtaqSans
      fonts:
        - asset: assets/fonts/OrtaqSans-Regular.ttf
        - asset: assets/fonts/OrtaqSans-Bold.ttf
          weight: 700
