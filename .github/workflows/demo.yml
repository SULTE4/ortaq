name: Demo verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ortaq
          POSTGRES_PASSWORD: ortaq_test
          POSTGRES_DB: ortaq_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U ortaq -d ortaq_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.x", cache-dependency-path: backend/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: make check
        env:
          TEST_DATABASE_URL: postgres://ortaq:ortaq_test@localhost:55432/ortaq_test?sslmode=disable
      - run: npm install --no-audit --no-fund && npm test && npm run build
        working-directory: web3d
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: python3 scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down
